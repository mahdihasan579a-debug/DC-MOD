<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-C Mods Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Orbitron,Arial,sans-serif;background:#02070d;color:#fff}
body{background:
 radial-gradient(circle at 15% 10%,rgba(20,52,80,.22),transparent 30%),
 linear-gradient(180deg,#03080e,#07101b 55%,#02070d)}
.container{width:min(680px,94%);margin:0 auto;padding:46px 0 70px}
h1{font-size:clamp(30px,7vw,52px);margin:0 0 18px;font-weight:800;letter-spacing:1px}
.search-row{display:flex;gap:12px;margin-bottom:28px}
.search{flex:1;background:#111a2c;border:0;outline:0;color:#fff;border-radius:35px;padding:17px 24px;font:600 17px Orbitron;box-shadow:0 8px 20px #0005}
.search::placeholder{color:#8290ad}
.search-btn{width:70px;border:0;border-radius:24px;background:#111a2c;color:#3182ff;font-size:27px}
.card{background:linear-gradient(145deg,#101a2a,#0d1624);border-radius:25px;margin:18px 0;padding:24px;box-shadow:0 10px 28px #0007}
.top{display:flex;gap:20px;align-items:flex-start}
.icon{width:105px;height:105px;object-fit:cover;border-radius:4px;background:#202a38;flex:none}
.info{flex:1;min-width:0}
.title{font-size:clamp(18px,4.8vw,29px);line-height:1.08;font-weight:800;margin:2px 0 8px}
.desc{font-size:clamp(12px,3vw,17px);line-height:1.18;color:#8795b2;font-weight:600}
.download{display:block;text-decoration:none;text-align:center;background:#2f80ff;color:white;border-radius:24px;padding:17px 10px;margin:18px 0 0;font-size:20px;font-weight:800;box-shadow:0 6px 16px #0066ff45}
.download:active{transform:scale(.98)}
.empty{display:none;text-align:center;color:#8795b2;padding:30px}
@media(max-width:430px){
 .container{padding-top:36px}
 .card{padding:20px;border-radius:23px}
 .top{gap:15px}
 .icon{width:88px;height:88px}
 .download{font-size:18px;padding:15px}
}
</style>
</head>
<body>
<main class="container">
  <h1 id="hubTitle">D-C Mods Hub</h1>
  <div class="search-row">
    <input id="search" class="search" type="search" placeholder="Search apps..." autocomplete="off">
    <button class="search-btn" aria-label="Search">⌕</button>
  </div>
  <section id="list"></section>
  <div id="empty" class="empty">No apps found.</div>
</main>

<script>
/*
  GITHUB UPDATE SETUP:
  Put config.json in your GitHub repository beside this index.html.
  Change config.json only when you want to add/edit download links.
*/
const CONFIG_URL = "./config.json";

const list = document.getElementById("list");
const empty = document.getElementById("empty");
const search = document.getElementById("search");
let apps = [];

function render(filter=""){
  const q = filter.trim().toLowerCase();
  const shown = apps.filter(a =>
    `${a.title} ${a.description}`.toLowerCase().includes(q)
  );
  list.innerHTML = shown.map(a => `
    <article class="card">
      <div class="top">
        <img class="icon" src="${escapeAttr(a.icon || "")}" alt="">
        <div class="info">
          <div class="title">${escapeHtml(a.title)}</div>
          <div class="desc">${escapeHtml(a.description || "")}</div>
        </div>
      </div>
      <a class="download" href="${escapeAttr(a.url)}" target="_blank" rel="noopener">Download</a>
    </article>
  `).join("");
  empty.style.display = shown.length ? "none" : "block";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function escapeAttr(s){return escapeHtml(s);}

async function loadConfig(){
  try{
    const r = await fetch(CONFIG_URL + "?v=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("config.json not found");
    const data = await r.json();
    document.title = data.siteTitle || "D-C Mods Hub";
    document.getElementById("hubTitle").textContent = data.siteTitle || "D-C Mods Hub";
    apps = Array.isArray(data.apps) ? data.apps : [];
    render();
  }catch(e){
    list.innerHTML = `<div class="empty" style="display:block">Unable to load config.json.</div>`;
  }
}
search.addEventListener("input", e => render(e.target.value));
loadConfig();
</script>
</body>
</html>
